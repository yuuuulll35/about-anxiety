<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>마녀의 속마음 실험실</title>
  <meta name="description" content="밤의 다락방에서 NPC의 마음을 사랑의 묘약으로 끓이는 작은 게임. 나만의 물약을 먼저 만들고, AI 레시피로 끓인 진짜 물약과 비교한다.">
  <meta property="og:title" content="마녀의 속마음 실험실">
  <meta property="og:description" content="매달린 재료 12병, 연기 속 환영 6개, 봉랍으로 막아 둔 마지막 한 방울.">
  <meta name="theme-color" content="#140f26">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='26' rx='24' ry='6' fill='%23b6f36b'/%3E%3Cpath d='M9 26 C7 48 20 58 32 58 C44 58 57 48 55 26 Z' fill='%231e1630'/%3E%3Ccircle cx='24' cy='14' r='4' fill='%23b6f36b'/%3E%3Ccircle cx='36' cy='8' r='3' fill='%23b6f36b'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Gothic+Coding:wght@400;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage" id="stage" data-phase="title">
    <!-- 방 배경 -->
    <div class="room" aria-hidden="true">
      <div class="wall"></div>
      <div class="motes"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="vignette"></div>
    </div>

    <!-- 상단 HUD -->
    <header class="hud-top">
      <div class="brand"><h1>마녀의 속마음 실험실</h1></div>
      <span class="who" id="who" hidden></span>
      <span class="moon-chip" title="오늘의 달"><span id="moon">🌕</span></span>
      <button class="hud-btn" id="soundBtn" type="button" aria-pressed="false" aria-label="소리 켜기"><span aria-hidden="true">♪</span><span class="sound-label">끔</span></button>
    </header>

    <!-- 재료 선반 -->
    <div class="rack" id="rack" aria-label="재료 선반 12병">
      <div class="shelf-panel">
        <div class="hangs" id="hangs" role="list"></div>
      </div>
    </div>

    <!-- 솥 · 레시피책 · 고양이 -->
    <div class="floor">
      <div class="say-box" id="sayBox">
        <span class="say-name">먹물</span>
        <div class="say" id="catSay" role="status" aria-live="polite"></div>
        <div class="say-form" id="sayForm" hidden></div>
      </div>

      <div class="pot-zone" id="potZone">
        <svg class="stir-ring" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="50" cy="50" rx="47" ry="45" pathLength="100"/><ellipse class="ring-fg" id="ringFg" cx="50" cy="50" rx="47" ry="45" pathLength="100"/></svg>
        <div class="pot" id="pot" role="button" tabindex="0" aria-label="솥"></div>
        <div class="vision-rise" id="visionRise" aria-hidden="true"></div>
        <button class="flask-btn" id="flaskBtn" type="button" aria-label="봉랍 두드리기. 세 번 두드리면 깨집니다" hidden>
          <svg class="flask" viewBox="0 0 200 270" aria-hidden="true">
            <defs><clipPath id="flaskClip"><circle cx="100" cy="182" r="70"/></clipPath></defs>
            <rect class="f-neck" x="78" y="40" width="44" height="80" rx="6"/>
            <circle class="f-body" cx="100" cy="182" r="74"/>
            <g clip-path="url(#flaskClip)">
              <path class="f-liquid" d="M20 170 Q60 158 100 170 T180 170 V260 H20 Z"/>
              <circle class="f-bub b1" cx="80" cy="220" r="5"/><circle class="f-bub b2" cx="118" cy="232" r="4"/><circle class="f-bub b3" cx="98" cy="206" r="3"/>
            </g>
            <path class="f-shine" d="M52 160 Q48 200 70 228"/>
            <rect class="f-cork" x="74" y="18" width="52" height="30" rx="7"/>
            <g class="wax">
              <path class="wax-blob" d="M100 22 C122 20 134 32 132 48 C136 64 122 76 104 74 C84 80 66 68 68 50 C62 34 80 20 100 22 Z"/>
              <path class="wax-drip" d="M76 64 q-4 14 2 18 q6 -4 4 -16 Z M120 68 q2 12 7 12 q4 -6 -2 -14 Z"/>
              <path class="wax-sigil" d="M100 32 L104 44 L116 44 L106 52 L110 64 L100 56 L90 64 L94 52 L84 44 L96 44 Z"/>
              <path class="crack c1" d="M86 30 L96 44 L90 52"/>
              <path class="crack c2" d="M126 40 L110 52 L118 66"/>
            </g>
          </svg>
        </button>
      </div>

      <!-- 왼쪽 아래: 레시피책 -->
      <button class="lectern" id="bookBtn" type="button" aria-label="레시피책 펼치기">
        <svg viewBox="0 0 150 124" aria-hidden="true">
          <defs>
            <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7d3a6c"/><stop offset="1" stop-color="#3f1a3a"/></linearGradient>
          </defs>
          <path class="bk-pages" d="M24 32 L132 20 L140 94 L32 106 Z"/>
          <path class="bk-pagelines" d="M132 26 L139 88 M129 24 L136 90"/>
          <path class="bk-cover" d="M14 26 Q14 20 20 19 L122 8 Q130 7 131 15 L139 86 Q140 93 133 94 L26 108 Q19 109 18 102 Z" fill="url(#cover)"/>
          <path class="bk-spine" d="M22 22 L30 106"/>
          <circle class="bk-emblem" cx="80" cy="56" r="17"/>
          <path class="bk-moon" d="M86 46 A12 12 0 1 0 86 66 A9 9 0 1 1 86 46 Z"/>
          <path class="bk-corner" d="M118 10 L130 9 L131 21 Z M124 94 L136 93 L134 82 Z"/>
          <path class="bk-ribbon" d="M98 100 L101 122 L95 116 L90 123 L89 101 Z"/>
        </svg>
        <span class="tag-label">레시피</span>
        <span class="ping" aria-hidden="true"></span>
      </button>

      <!-- 오른쪽: 빼꼼 내다보는 고양이 -->
      <div class="familiar" id="cat">
        <svg class="cat" viewBox="0 0 170 210" preserveAspectRatio="xMaxYMax meet" aria-hidden="true">
          <defs>
            <radialGradient id="fur" cx="45%" cy="30%" r="75%"><stop offset="0" stop-color="#3a3060"/><stop offset=".6" stop-color="#1d1734"/><stop offset="1" stop-color="#110d20"/></radialGradient>
            <radialGradient id="iris" cx="50%" cy="60%" r="60%"><stop offset="0" stop-color="#e6ff9e"/><stop offset=".6" stop-color="#a8ee5a"/><stop offset="1" stop-color="#5fae2e"/></radialGradient>
            <linearGradient id="pil" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a2d5c"/><stop offset=".15" stop-color="#271e42"/><stop offset="1" stop-color="#171127"/></linearGradient>
            <linearGradient id="pilFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".3" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
            <mask id="pilMask"><rect x="0" y="0" width="170" height="210" fill="url(#pilFade)"/></mask>
          </defs>
          <g class="cat-peek">
            <path class="cat-head" d="M28 120 C24 96 34 80 48 72 L42 38 L66 60 C74 58 86 58 94 60 L118 38 L112 72 C126 80 134 98 130 120 C126 142 104 152 79 152 C54 152 32 142 28 120 Z"/>
            <g class="cat-eyes">
              <path class="cat-eye" d="M48 108 Q61 95 74 108 Q61 119 48 108 Z"/>
              <path class="cat-eye" d="M84 108 Q97 95 110 108 Q97 119 84 108 Z"/>
              <g id="catPupils"><ellipse class="cat-pupil" cx="61" cy="108" rx="2.6" ry="7.5"/><ellipse class="cat-pupil" cx="97" cy="108" rx="2.6" ry="7.5"/></g>
            </g>
            <path class="cat-nose" d="M75 122 L83 122 L79 127 Z"/>
            <path class="cat-whisk" d="M44 124 L24 121 M44 129 L25 132"/>
            <g class="cat-hatg">
              <path class="cat-hat" d="M50 64 C56 50 62 36 70 26 C78 16 92 13 104 18 C94 22 88 30 87 40 C86 49 90 56 96 60 Z"/>
              <path class="cat-band" d="M51 60 C63 56 83 55 95 57 L95 62 C83 60 64 61 52 65 Z"/>
              <ellipse class="cat-brim" cx="73" cy="64" rx="34" ry="6.5" transform="rotate(-8 73 64)"/>
              <path class="cat-star" d="M76 36 L78 40 L82 40 L79 43 L80 47 L76 45 L72 47 L73 43 L70 40 L74 40 Z"/>
            </g>
          </g>
          <g class="cat-wall" mask="url(#pilMask)">
            <rect x="118" y="0" width="52" height="210" fill="url(#pil)"/>
            <path class="wall-edge" d="M118.5 0 V210"/>
            <path class="wall-seam" d="M118 70 H170 M118 140 H170 M146 0 V70 M134 70 V140 M156 140 V210"/>
          </g>
          <g class="cat-paws"><path class="cat-paw-g" d="M108 146 C108 136 128 134 130 144 C132 152 124 156 116 155 C110 154 108 151 108 146 Z"/></g>
        </svg>
      </div>

      <button class="act-btn" id="actBtn" type="button" hidden></button>
    </div>

    <!-- 하단 HUD -->
    <footer class="hud" aria-label="진행 상황">
      <div class="track drops" id="trackDrops" aria-label="재료"></div>
      <div class="track stars" id="trackStars" aria-label="환영"></div>
      <div class="track seal" id="trackSeal" aria-label="봉랍"><i></i></div>
      <div class="hud-brew">
        <span class="mini-vial guess" id="vialGuess" title="나만의 물약"><i></i></span>
        <span class="arrow" aria-hidden="true">→</span>
        <span class="mini-vial real" id="vialReal" title="진짜 물약"><i></i></span>
        <span class="brew-text" id="brewText">맹물</span>
      </div>
    </footer>
  </div>

  <!-- 주문서(책) -->
  <dialog class="book" id="book" aria-labelledby="bookTitle">
    <div class="book-inner">
      <nav class="ribbons" aria-label="주문서 장">
        <button type="button" data-page="recipe">레시피</button>
        <button type="button" data-page="menu">메뉴</button>
      </nav>
      <button class="book-close" type="button" data-book-close aria-label="주문서 덮기">✕</button>

      <section class="page" data-page="menu">
        <p class="pg-no">주문서</p>
        <h2 id="bookTitle">무엇을 할까?</h2>
        <button class="btn primary wide" type="button" id="copyPrompt">📋 주문 1/3 복사</button>
        <button class="btn ghost wide" type="button" id="loadSample">예시로 체험하기</button>
        <button class="btn ghost wide" type="button" id="restart">처음부터 다시</button>
      </section>

      <section class="page" data-page="recipe">
        <p class="pg-no">마지막 장 · 레시피</p>
        <div class="recipe" id="recipe"><p class="pg-note">아직 완성된 물약이 없어요.</p></div>
        <button class="btn primary wide" type="button" id="saveImg">레시피 카드 저장</button>
      </section>
    </div>
  </dialog>

  <!-- 획득 카드 -->
  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <div class="sheet-inner" id="sheetInner"></div>
  </dialog>

  <!-- 두루마리 -->
  <dialog class="scroll-dlg" id="scrollDlg" aria-labelledby="deepLabel">
    <article class="scroll">
      <span class="scroll-roll top" aria-hidden="true"></span>
      <div class="scroll-paper">
        <p class="letter-label" id="deepLabel">마지막 한 방울 · <span id="kNpc">NPC</span> 본인 열람 금지</p>
        <blockquote class="letter-quote" id="deepTitle"></blockquote>
        <p class="letter-body" id="deepBody"></p>
        <p class="letter-sign">— 담당 마녀 무의식</p>
        <button class="btn primary wide" type="button" id="toRecipe" hidden>레시피로 기록하기</button>
      </div>
      <span class="scroll-roll bottom" aria-hidden="true"></span>
    </article>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <p class="sr-only">마녀의 속마음 실험실은 롤플레이 캐릭터의 감정을 놀이처럼 읽는 곳입니다. 실제 심리 진단이 아닙니다.</p>

  <script type="module" src="js/app.js"></script>
</body>
</html>
