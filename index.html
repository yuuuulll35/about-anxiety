<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>마음 달이는 다락방</title>
  <meta name="description" content="달밤의 다락방에서 마녀 고양이와 함께 NPC의 마음을 사랑의 묘약으로 달이는 작은 게임. 나만의 물약을 먼저 만들고, AI 레시피로 끓인 사랑의 물약과 비교한다.">
  <meta property="og:title" content="마음 달이는 다락방">
  <meta property="og:description" content="매달린 재료 12병, 연기 속 환영 6개, 코르크로 막아 둔 마지막 한 방울.">
  <meta name="theme-color" content="#140f26">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M10 40 C8 26 14 18 20 15 L17 3 L28 11 C30 10.5 34 10.5 36 11 L47 3 L44 15 C50 18 56 26 54 40 C52 54 42 60 32 60 C22 60 12 54 10 40 Z' fill='%231a1430' stroke='%23b6a6ff' stroke-width='2'/%3E%3Cpath d='M18 36 Q23 30 28 36 Q23 40 18 36 Z M36 36 Q41 30 46 36 Q41 40 36 36 Z' fill='%23b6f36b'/%3E%3Cpath d='M23 32 V40 M41 32 V40' stroke='%231a1430' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M30 44 H34 L32 46.5 Z' fill='%23ff9fc4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Gothic+Coding:wght@400;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=50">
</head>
<body>
  <div class="stage" id="stage" data-phase="title">
    <!-- 방 배경 -->
    <div class="room" aria-hidden="true">
      <div class="wall"></div>
      <div class="motes"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="vignette"></div>
    </div>

    <!-- 상단 HUD -->
    <header class="hud-top">
      <div class="brand"><h1>마음 달이는 다락방</h1></div>
      <span class="who" id="who" hidden></span>
      <span class="moon-chip" title="오늘의 달"><span id="moon">🌕</span></span>
      <button class="hud-btn" id="soundBtn" type="button" aria-pressed="false" aria-label="소리 켜기"><span aria-hidden="true">♪</span><span class="sound-label">끔</span></button>
    </header>

    <!-- 재료 선반 -->
    <div class="rack" id="rack" aria-label="재료 선반 12병">
      <div class="shelf-panel">
        <div class="hangs" id="hangs" role="list"></div>
      </div>
    </div>

    <!-- 솥 · 레시피책 · 고양이 -->
    <div class="floor">
      <div class="say-box" id="sayBox">
        <span class="say-name">먹물</span>
        <div class="say" id="catSay" role="status" aria-live="polite"></div>
        <div class="say-form" id="sayForm" hidden></div>
        <button class="act-btn" id="actBtn" type="button" hidden></button>
      </div>

      <div class="pot-zone" id="potZone">
        <svg class="stir-ring" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="50" cy="50" rx="47" ry="45" pathLength="100"/><ellipse class="ring-fg" id="ringFg" cx="50" cy="50" rx="47" ry="45" pathLength="100"/></svg>
        <div class="pot" id="pot" role="button" tabindex="0" aria-label="솥"></div>
        <div class="vision-rise" id="visionRise" aria-hidden="true"></div>
        <p class="stir-hint" aria-hidden="true"><span>↻</span>여기를 빙글빙글</p>
        <button type="button" class="guess-done" id="guessDone" aria-label="물약 완성. 눌러서 계속"><span class="gd-rays"></span><svg class="gd-flask" viewBox="0 0 80 100" aria-hidden="true"><path class="gd-glass" d="M30 6 H50 V34 C64 40 72 52 72 66 C72 84 58 96 40 96 C22 96 8 84 8 66 C8 52 16 40 30 34 Z"/><path class="gd-liquid" d="M11 64 Q25 58 40 64 T69 64 C70 82 57 93 40 93 C23 93 10 82 11 64 Z"/><path class="gd-shine" d="M20 62 Q18 76 28 86"/><rect class="gd-cork" x="27" y="0" width="26" height="10" rx="3"/></svg><span class="gd-title" id="gdTitle"></span><span class="gd-name" id="gdName"></span><span class="gd-sub" id="gdSub"></span><span class="gd-sparks"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></span></button>
        <div class="ignite" aria-hidden="true"><span class="ig-flash"></span><span class="ig-flames"><i class="fl1"></i><i class="fl2"></i><i class="fl3"></i><i class="fl4"></i><i class="fl5"></i><i class="fl6"></i><i class="fl7"></i></span><span class="ig-boil"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="ig-pop"><span class="ig-ring"></span><span class="ig-puff"><i style="--x:34%;--d:0.02s;--s:1"></i><i style="--x:50%;--d:0s;--s:1.3"></i><i style="--x:66%;--d:0.04s;--s:1.05"></i><i style="--x:42%;--d:0.1s;--s:0.8"></i><i style="--x:58%;--d:0.12s;--s:0.85"></i></span><span class="ig-stars"><b class="g" style="--dx:-147px;--dy:-34px;--d:0.08s;--r:-227deg;--s:0.75"></b><b class="p" style="--dx:-193px;--dy:-98px;--d:0.03s;--r:-201deg;--s:0.93"></b><b class="w" style="--dx:-146px;--dy:-101px;--d:0.01s;--r:-147deg;--s:1.05"></b><b class="g" style="--dx:-75px;--dy:-98px;--d:0.07s;--r:-146deg;--s:0.73"></b><b class="p" style="--dx:-42px;--dy:-129px;--d:0.02s;--r:-236deg;--s:0.87"></b><b class="w" style="--dx:-6px;--dy:-124px;--d:0.07s;--r:-185deg;--s:0.75"></b><b class="g" style="--dx:32px;--dy:-153px;--d:0.07s;--r:226deg;--s:0.94"></b><b class="p" style="--dx:57px;--dy:-150px;--d:0.05s;--r:153deg;--s:1.14"></b><b class="w" style="--dx:94px;--dy:-106px;--d:0.07s;--r:177deg;--s:1.10"></b><b class="g" style="--dx:160px;--dy:-139px;--d:0.01s;--r:132deg;--s:1.12"></b><b class="p" style="--dx:150px;--dy:-88px;--d:0.00s;--r:-232deg;--s:1.02"></b><b class="w" style="--dx:164px;--dy:-31px;--d:0.08s;--r:238deg;--s:1.14"></b></span></span></div>
        <button class="flask-btn" id="flaskBtn" type="button" aria-label="코르크 두드리기. 세 번 두드리면 빠집니다" hidden>
          <svg class="flask" viewBox="0 0 200 240" aria-hidden="true">
            <defs>
              <clipPath id="flaskClip"><circle cx="100" cy="148" r="69.5"/></clipPath>
              <clipPath id="flaskClipIn"><circle cx="100" cy="148" r="53"/></clipPath>
              <linearGradient id="flaskLiq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:color-mix(in srgb, var(--brew-l) 70%, #ffd9f0)"/><stop offset=".45" style="stop-color:var(--brew-l)"/><stop offset="1" style="stop-color:var(--brew-d)"/></linearGradient>
              <linearGradient id="corkGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b07a46"/><stop offset=".5" stop-color="#ddb07a"/><stop offset="1" stop-color="#9c6a3a"/></linearGradient>
                          </defs>
            <g class="f-stars">
              <path class="f-star s1" d="M24 92 l3 7 7 1 -5 5 1.5 7 -6.5 -3.5 -6.5 3.5 1.5 -7 -5 -5 7 -1 Z"/>
              <path class="f-star s2" d="M176 70 l2.4 5.6 5.6 .8 -4 4 1.2 5.6 -5.2 -2.8 -5.2 2.8 1.2 -5.6 -4 -4 5.6 -.8 Z"/>
              <path class="f-star s3" d="M186 160 l2 5 5 .7 -3.6 3.5 1 5 -4.4 -2.4 -4.4 2.4 1 -5 -3.6 -3.5 5 -.7 Z"/>
              <path class="f-star s4" d="M14 178 l2 5 5 .7 -3.6 3.5 1 5 -4.4 -2.4 -4.4 2.4 1 -5 -3.6 -3.5 5 -.7 Z"/>
              <path class="f-spark s5" d="M160 222 q1.5 -6 7 -7 q-5.5 -1 -7 -7 q-1.5 6 -7 7 q5.5 1 7 7 Z"/>
              <path class="f-spark s6" d="M40 40 q1.2 -5 6 -6 q-4.8 -1 -6 -6 q-1.2 5 -6 6 q4.8 1 6 6 Z"/>
            </g>
            <!-- 병 몸통: 목과 둥근 배가 한 줄로 이어진 하나의 외곽선 (선이 서로 겹치지 않는다) -->
            <path class="f-glass" d="M82 60 V78.3 A72 72 0 1 0 118 78.3 V60 Z"/>
            <g clip-path="url(#flaskClip)">
              <g class="f-slosh">
                <path class="f-liquid back f-wave2" d="M-30 117 q25.0 -7 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 V240 H-30 Z"/>
                <path class="f-liquid f-wave" d="M-20 124 q20.0 -9 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 V240 H-20 Z"/>
                <g clip-path="url(#flaskClipIn)"><path class="f-surface f-wave" d="M-20 124 q20.0 -9 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/></g>
              </g>
              <g class="f-deco">
                <path d="M78 182 C66 174 62 166 65 161 C68 156 75 157 78 162 C81 157 88 156 91 161 C94 166 90 174 78 182 Z"/>
                <path d="M128 206 C120 201 117 196 119 192.5 C121 189 126 190 128 193 C130 190 135 189 137 192.5 C139 196 136 201 128 206 Z"/>
                <path d="M62 200 q1.2 -5 5 -6 q-3.8 -1 -5 -6 q-1.2 5 -5 6 q3.8 1 5 6 Z"/>
                <path d="M86 206 q1 -4 4 -5 q-3 -1 -4 -5 q-1 4 -4 5 q3 1 4 5 Z"/>
              </g>
              <circle class="f-bub b1" cx="110" cy="208" r="4"/><circle class="f-bub b2" cx="116" cy="214" r="3"/><circle class="f-bub b3" cx="100" cy="186" r="2.5"/>
            </g>
            <path class="f-body" d="M82 63 V78.3 A72 72 0 1 0 118 78.3 V63"/>
            <path class="f-shine" d="M50 116 A60 60 0 0 0 43 170"/>
            <circle class="f-glint" cx="62" cy="102" r="5"/>
            <path class="f-shine thin" d="M141 189 A58 58 0 0 0 154.5 168"/>
            <path class="f-shine neck" d="M91 72 V78"/>
            <!-- 코르크: 두드릴 때마다 조금씩 들썩이다가 세 번째에 뽁 빠진다 -->
            <g class="cork-g">
              <g class="cork-lift">
              <g transform="rotate(12 100 52)">
                <rect class="f-cork" x="82" y="12" width="36" height="44" rx="11"/>
                <path class="f-cork-line" d="M89 24 H111 M89 34 H111"/>
                <circle class="f-cork-dot" cx="94" cy="44" r="2.2"/><circle class="f-cork-dot" cx="107" cy="29" r="1.8"/><circle class="f-cork-dot" cx="96" cy="18" r="1.5"/>
              </g>
              </g>
            </g>
            <rect class="f-lip" x="73" y="50" width="54" height="15" rx="7.5"/>
            <path class="f-lip-shine" d="M80 55 H96"/>
          </svg>
        </button>
      </div>

      <!-- 왼쪽 아래: 레시피책 -->
      <button class="lectern" id="bookBtn" type="button" aria-label="레시피책 펼치기">
        <svg viewBox="0 0 150 124" aria-hidden="true">
          <defs>
            <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7d3a6c"/><stop offset="1" stop-color="#3f1a3a"/></linearGradient>
          </defs>
          <path class="bk-pages" d="M24 32 L132 20 L140 94 L32 106 Z"/>
          <path class="bk-pagelines" d="M132 26 L139 88 M129 24 L136 90"/>
          <path class="bk-cover" d="M14 26 Q14 20 20 19 L122 8 Q130 7 131 15 L139 86 Q140 93 133 94 L26 108 Q19 109 18 102 Z" fill="url(#cover)"/>
          <path class="bk-spine" d="M22 22 L30 106"/>
          <circle class="bk-emblem" cx="80" cy="56" r="17"/>
          <path class="bk-moon" d="M86 46 A12 12 0 1 0 86 66 A9 9 0 1 1 86 46 Z"/>
          <path class="bk-corner" d="M118 10 L130 9 L131 21 Z M124 94 L136 93 L134 82 Z"/>
          <path class="bk-ribbon" d="M98 100 L101 122 L95 116 L90 123 L89 101 Z"/>
        </svg>
        <span class="tag-label">레시피</span>
        <span class="ping" aria-hidden="true"></span>
      </button>

      <!-- 오른쪽: 빼꼼 내다보는 고양이 -->
      <div class="familiar" id="cat">
        <svg class="cat" viewBox="0 0 170 210" preserveAspectRatio="xMaxYMax meet" aria-hidden="true">
          <defs>
            <radialGradient id="fur" cx="45%" cy="30%" r="75%"><stop offset="0" stop-color="#3a3060"/><stop offset=".6" stop-color="#1d1734"/><stop offset="1" stop-color="#110d20"/></radialGradient>
            <radialGradient id="iris" cx="50%" cy="60%" r="60%"><stop offset="0" stop-color="#e6ff9e"/><stop offset=".6" stop-color="#a8ee5a"/><stop offset="1" stop-color="#5fae2e"/></radialGradient>
            <linearGradient id="pil" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a2d5c"/><stop offset=".15" stop-color="#271e42"/><stop offset="1" stop-color="#171127"/></linearGradient>
            <linearGradient id="pilFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".3" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
            <mask id="pilMask"><rect x="0" y="0" width="170" height="210" fill="url(#pilFade)"/></mask>
          </defs>
          <g class="cat-peek">
            <path class="cat-head" d="M28 120 C24 96 34 80 48 72 L42 38 L66 60 C74 58 86 58 94 60 L118 38 L112 72 C126 80 134 98 130 120 C126 142 104 152 79 152 C54 152 32 142 28 120 Z"/>
            <g class="cat-eyes">
              <path class="cat-eye" d="M48 108 Q61 95 74 108 Q61 119 48 108 Z"/>
              <path class="cat-eye" d="M84 108 Q97 95 110 108 Q97 119 84 108 Z"/>
              <g id="catPupils"><ellipse class="cat-pupil" cx="61" cy="108" rx="2.6" ry="7.5"/><ellipse class="cat-pupil" cx="97" cy="108" rx="2.6" ry="7.5"/></g>
            </g>
            <path class="cat-nose" d="M75 122 L83 122 L79 127 Z"/>
            <path class="cat-whisk" d="M44 124 L24 121 M44 129 L25 132"/>
            <g class="cat-hatg">
              <path class="cat-hat" d="M50 64 C56 50 62 36 70 26 C78 16 92 13 104 18 C94 22 88 30 87 40 C86 49 90 56 96 60 Z"/>
              <path class="cat-band" d="M51 60 C63 56 83 55 95 57 L95 62 C83 60 64 61 52 65 Z"/>
              <ellipse class="cat-brim" cx="73" cy="64" rx="34" ry="6.5" transform="rotate(-8 73 64)"/>
              <path class="cat-star" d="M76 36 L78 40 L82 40 L79 43 L80 47 L76 45 L72 47 L73 43 L70 40 L74 40 Z"/>
            </g>
          </g>
          <g class="cat-wall" mask="url(#pilMask)">
            <rect x="118" y="0" width="52" height="210" fill="url(#pil)"/>
            <path class="wall-edge" d="M118.5 0 V210"/>
            <path class="wall-seam" d="M118 70 H170 M118 140 H170 M146 0 V70 M134 70 V140 M156 140 V210"/>
          </g>
          <g class="cat-paws"><path class="cat-paw-g" d="M108 146 C108 136 128 134 130 144 C132 152 124 156 116 155 C110 154 108 151 108 146 Z"/></g>
        </svg>
      </div>

    </div>

    <!-- 하단 HUD -->
    <footer class="hud" aria-label="진행 상황">
      <div class="track drops" id="trackDrops" aria-label="재료"></div>
      <div class="track stars" id="trackStars" aria-label="환영"></div>
      <div class="track seal" id="trackSeal" aria-label="코르크"><i></i></div>
      <div class="hud-brew">
        <span class="mini-vial guess" id="vialGuess" title="나만의 물약"><i></i></span>
        <span class="arrow" aria-hidden="true">→</span>
        <span class="mini-vial real" id="vialReal" title="사랑의 물약"><i></i></span>
        <span class="brew-text" id="brewText">맹물</span>
      </div>
    </footer>
  </div>

  <!-- 주문서(책) -->
  <dialog class="book" id="book" aria-labelledby="bookTitle">
    <div class="book-inner">
      <header class="book-head">
        <nav class="ribbons seg" aria-label="주문서 장">
          <button type="button" data-page="recipe">레시피</button>
          <button type="button" data-page="menu">메뉴</button>
        </nav>
        <button class="book-close" type="button" data-book-close aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18"/></svg></button>
      </header>

      <section class="page" data-page="menu">
        <h2 id="bookTitle">무엇을 할까?</h2>
        <button class="btn primary wide" type="button" id="restart">처음부터 다시</button>
        <button class="btn wide" type="button" id="loadSample">예시로 체험하기</button>
      </section>

      <section class="page" data-page="recipe">
        <div class="recipe" id="recipe"><p class="pg-note">아직 완성된 물약이 없어요.</p></div>
        <button class="btn primary wide" type="button" id="saveImg">레시피 카드 이미지로 저장</button>
      </section>
    </div>
  </dialog>

  <!-- 획득 카드 -->
  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <div class="sheet-inner" id="sheetInner"></div>
  </dialog>

  <!-- 두루마리 -->
  <dialog class="scroll-dlg" id="scrollDlg" aria-labelledby="deepLabel">
    <article class="scroll">
      <span class="scroll-roll top" aria-hidden="true"></span>
      <div class="scroll-paper">
        <p class="letter-label" id="deepLabel"><span id="kNpc">NPC</span>, 아직 하지 못한 말</p>
        <blockquote class="letter-quote" id="deepTitle"></blockquote>
        <p class="letter-en" id="deepEn" hidden></p>
        <p class="letter-body" id="deepBody"></p>
        <button class="btn primary wide" type="button" id="toRecipe" hidden>레시피로 기록하기</button>
      </div>
      <span class="scroll-roll bottom" aria-hidden="true"></span>
    </article>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <p class="sr-only">마음 달이는 다락방은 롤플레이 캐릭터의 감정을 놀이처럼 읽는 곳입니다. 실제 심리 진단이 아닙니다.</p>

  <script type="module" src="js/app.js?v=47"></script>
</body>
</html>
