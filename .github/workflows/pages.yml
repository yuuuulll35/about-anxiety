# main 에 푸시되면 파서 테스트 후 정적 파일을 GitHub Pages 로 배포한다.
# 처음 한 번: Settings → Pages → Source 를 "GitHub Actions" 로 지정해야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: mkdir _site && cp -r index.html style.css js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: echo "PAGE_URL=${{ steps.deployment.outputs.page_url }}"
